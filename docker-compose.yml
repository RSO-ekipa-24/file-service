services:
  db-files:
    image: postgres:16
    container_name: db-files
    restart: always
    environment:
      POSTGRES_DB: files_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - files_pg_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  file-service:
    image: file-service:latest
    container_name: file-service
    depends_on:
      - db-files
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db-files:5432/files_db
      QUARKUS_DATASOURCE_USERNAME: ${DB_USERNAME}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_OIDC_AUTH_SERVER_URL: ${QUARKUS_OIDC_AUTH_SERVER_URL}
      QUARKUS_OIDC_CLIENT_ID: ${QUARKUS_OIDC_CLIENT_ID}
      QUARKUS_OIDC_CLIENT_SECRET: ${QUARKUS_OIDC_CLIENT_SECRET}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
    ports:
      - "6868:6868"

